<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d91"><link rel="manifest" href="manifest.webmanifest">
<title>RoadBook</title>
<style>
:root{--b:#0b3d91;--g:#0b8f45;--bg:#f5f7fb;--t:#142033;--m:#687386;--l:#e2e7ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--t)}
.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}header{background:linear-gradient(145deg,#073274,#1262bf);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 18px;border-radius:0 0 26px 26px}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:800}.status{font-size:13px;background:#08783d;border-radius:18px;padding:7px 11px}.route{font-size:25px;font-weight:800;margin-top:16px}.sub{opacity:.85}
main{padding:16px}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:17px;margin-bottom:14px;box-shadow:0 4px 14px #102a430d}
.current{display:flex;justify-content:space-between;gap:12px}.pin{font-size:30px}.place{font-size:23px;font-weight:800}.muted{color:var(--m);font-size:14px;margin-top:4px}
.big{width:100%;border:0;border-radius:19px;padding:18px;background:var(--g);color:#fff;font-size:19px;font-weight:800}.big small{font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.action{border:0;border-radius:19px;padding:20px 10px;font-size:17px;font-weight:800;min-height:105px}.action span{display:block;font-size:32px;margin-bottom:8px}.fuel{background:#e6faec}.expense{background:#fff0e7}.stop{background:#e8f3ff}.note{background:#f2eaff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.stats b{display:block;font-size:19px;margin-top:5px}.stats small{color:var(--m)}.sync{background:#e7faee;color:#075b2f}.sync b{display:block}.sync span{font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(14px);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;font-size:12px;color:#667085;padding:6px}nav button b{display:block;font-size:22px;margin-bottom:3px}
dialog{border:0;border-radius:24px;width:min(92%,460px);padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h2{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--m);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;font-size:16px;background:#fff}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1;padding:13px;border-radius:13px;border:0;font-weight:700}.save{background:var(--g);color:#fff}.cancel{background:#eef1f5}.empty{color:var(--m);text-align:center;padding:20px}
</style></head><body>
<div class="app"><header><div class="top"><div class="brand">🚙 RoadBook</div><div class="status" id="status">🟢 OFFLINE</div></div>
<div class="route">Анапа → Екатеринбург</div><div class="sub">3 010 км · поездка №1</div></header>
<main>
<section class="card current"><div><div class="pin">📍</div><div class="place">Краснодар</div><div class="muted">Следующая точка · 186 км</div></div>
<div style="text-align:right"><div class="muted">Осталось</div><strong>2 824 км</strong><div class="muted">Потрачено</div><strong id="spent">0 ₽</strong></div></section>
<button class="big" onclick="openYandex()">🧭 ПРОДОЛЖИТЬ МАРШРУТ<br><small>Открыть следующую точку в Яндекс Картах</small></button>
<div class="grid">
<button class="action fuel" onclick="openForm('fuel')"><span>⛽</span>ЗАПРАВКА</button>
<button class="action expense" onclick="openForm('expense')"><span>🍔</span>РАСХОД</button>
<button class="action stop" onclick="openForm('stop')"><span>📍</span>ОСТАНОВКА</button>
<button class="action note" onclick="openForm('note')"><span>📝</span>ЗАМЕТКА</button></div>
<section class="card stats"><div><small>Потрачено</small><b id="spent2">0 ₽</b></div><div><small>План</small><b>39 500 ₽</b></div><div><small>До финиша</small><b>2 824 км</b></div></section>
<section class="card sync"><b>☁️ Данные сохраняются локально</b><span id="syncText">Можно работать без интернета. Записей: 0</span></section>
<section class="card"><b>📋 Последние записи</b><div id="records" class="empty">Пока записей нет</div></section>
</main>
<nav><button onclick="top()">⌂<br>Главная</button><button onclick="openYandex()">⌁<br>Карта</button><button onclick="document.getElementById('records').scrollIntoView({behavior:'smooth'})">☷<br>Журнал</button><button onclick="alert('RoadBook v0.4\nДанные сохраняются локально. Интернет для записи не нужен.')">⚙<br>Ещё</button></nav>
</div>
<dialog id="dlg"><form class="modal" id="form"></form></dialog>
<script>
const KEY='roadbook_v04_records';let records=JSON.parse(localStorage.getItem(KEY)||'[]');
const dlg=document.getElementById('dlg');
function save(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function openForm(type){let title={fuel:'⛽ Новая заправка',expense:'🍔 Новый расход',stop:'📍 Новая остановка',note:'📝 Новая заметка'}[type],body='';
if(type==='fuel')body='<div class="field"><label>Топливо</label><select id="fuel"><option>Газ</option><option>Бензин</option></select></div><div class="field"><label>Литры</label><input id="liters" inputmode="decimal" placeholder="38,5"></div><div class="field"><label>Цена, ₽/л</label><input id="price" inputmode="decimal" placeholder="35,50"></div><div class="field"><label>Где</label><input id="place" placeholder="Краснодар"></div>';
if(type==='expense')body='<div class="field"><label>Категория</label><select id="category"><option>Еда</option><option>Платные дороги</option><option>Прочее</option></select></div><div class="field"><label>Сумма, ₽</label><input id="amount" inputmode="decimal" placeholder="850"></div><div class="field"><label>Где</label><input id="place" placeholder="АЗС"></div><div class="field"><label>Комментарий</label><input id="comment" placeholder="Завтрак"></div>';
if(type==='stop')body='<div class="field"><label>Где</label><input id="place" placeholder="Краснодар"></div><div class="field"><label>Пробег, км</label><input id="odo" inputmode="numeric" placeholder="125430"></div><div class="field"><label>Комментарий</label><textarea id="comment" rows="3"></textarea></div>';
if(type==='note')body='<div class="field"><label>Заметка</label><textarea id="comment" rows="5" placeholder="Например: проверить давление в шинах"></textarea></div>';
document.getElementById('form').innerHTML='<h2>'+title+'</h2>'+body+'<div class="modal-actions"><button class="cancel" type="button" onclick="dlg.close()">Отмена</button><button class="save" type="button" onclick="submitForm(\''+type+'\')">Сохранить</button></div>';dlg.showModal()}
function v(id){return(document.getElementById(id)?.value||'').trim()}function n(id){return Number(v(id).replace(',','.'))||0}
function submitForm(type){let r={type,time:new Date().toISOString()};if(type==='fuel'){r.fuel=v('fuel');r.liters=n('liters');r.price=n('price');r.sum=r.liters*r.price;r.place=v('place')}if(type==='expense'){r.category=v('category');r.amount=n('amount');r.place=v('place');r.comment=v('comment')}if(type==='stop'){r.place=v('place');r.odo=n('odo');r.comment=v('comment')}if(type==='note')r.comment=v('comment');records.unshift(r);save();dlg.close()}
function render(){let spent=records.reduce((s,r)=>s+(r.sum||r.amount||0),0),s=Math.round(spent).toLocaleString('ru-RU')+' ₽';document.getElementById('spent').textContent=s;document.getElementById('spent2').textContent=s;document.getElementById('syncText').textContent='Можно работать без интернета. Записей: '+records.length;let box=document.getElementById('records');if(!records.length){box.className='empty';box.textContent='Пока записей нет';return}box.className='';box.innerHTML=records.slice(0,5).map(r=>{let t=r.type==='fuel'?'⛽ '+r.fuel+' · '+Math.round(r.sum)+' ₽':r.type==='expense'?'🍔 '+r.category+' · '+Math.round(r.amount)+' ₽':r.type==='stop'?'📍 '+r.place:'📝 '+r.comment;return '<div style="padding:11px 0;border-bottom:1px solid var(--l)">'+t+'<div class="muted">'+new Date(r.time).toLocaleString('ru-RU')+'</div></div>'}).join('')}
function openYandex(){location.href='https://yandex.ru/maps/?rtext=Краснодар&rtt=auto'}function top(){scrollTo({top:0,behavior:'smooth'})}
addEventListener('online',()=>status.textContent='🟢 ONLINE');addEventListener('offline',()=>status.textContent='🟢 OFFLINE');render();
</script></body></html>
